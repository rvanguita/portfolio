# ==============================================================================
# Configurações do Site Estático (Jekyll / GitHub Pages)
# ==============================================================================

# Informações Principais do Portfólio
title: "Rene Verinaud Anguita Junior | Data Scientist & Optimization"
description: "Portfólio profissional de Rene Verinaud Anguita Junior, Ph.D. em Engenharia Elétrica, especialista em Ciência de Dados, Machine Learning e Otimização de Sistemas."
url: "https://rvanguita.github.io"
baseurl: "/portfolio"

# Identidade Visual e Imagens
logo: "/assets/img/face.png"
favicon: "/assets/img/cv.png"
show_downloads: false

# Informações do Autor (usadas em SEO e metadados)
author:
  name: "Rene Verinaud Anguita Junior"
  title: "Data Scientist | Ph.D. Electrical Engineering"
  email: "renevajr@gmail.com"
  location: "Campinas, SP, Brasil"
  github: "rvanguita"
  linkedin: "rvanguita"

# Plugins suportados nativamente pelo GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Cartão de Compartilhamento Social (Open Graph / Twitter Card): jekyll-seo-tag lê
# `page.image`, não `site.image` — via `defaults` isso vale para toda página sem precisar
# repetir no front matter de cada uma. Uma vez presente, o twitter:card vira
# automaticamente "summary_large_image" (jekyll-seo-tag decide isso sozinho).
defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/img/social-card.png"
        height: 630
        width: 1200
        alt: "Rene Anguita — Data Scientist & Ph.D. Engenharia Elétrica"

# Estilos e Customização
include_css:
  - /assets/css/custom.css

text_styles:
  justify_text: "text-align: justify;"
  center_text: "margin-left: auto; margin-right: auto;"
  max_width: "max-width: 900px;"

# Exclusão de arquivos auxiliares na geração do site estático
exclude:
  - .github/
  - .gitignore
  - .bundle/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md.bak
  - CLAUDE.md
  - scripts/