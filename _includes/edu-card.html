<div class="edu-card">
  <div class="edu-card-top">
    <span class="edu-degree">{{ include.entry.degree }}</span>
    <span class="edu-year">{{ include.entry.year }}</span>
  </div>
  <span class="edu-institution">{{ include.entry.institution }}</span>
  {% if include.entry.description %}<p class="edu-description">{{ include.entry.description }}</p>{% endif %}
</div>
