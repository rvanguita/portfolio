<div class="skill-card">
  <div class="skill-card-header">
    {% include icon.html name=include.icon class='skill-icon' %}<h3>{{ include.title }}</h3>
  </div>
  {% if include.description %}<p class="case-study-copy">{{ include.description }}</p>{% endif %}
  <div class="skill-tags-group">
    {% for tag in include.tags %}<span class="skill-pill">{{ tag }}</span>
    {% endfor %}
  </div>
</div>
