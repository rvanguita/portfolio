# ==============================================================================
# GitHub Actions: Validação Contínua (CI) — Next.js
# ==============================================================================
# Lint + typecheck + testes (Vitest) + build estático (next build) em Pull
# Requests para main. Um build que falha bloqueia a mesclagem.
# ==============================================================================

name: 🧪 Validação do Portfólio (CI)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 🔍 Lint, Types, Testes & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🎨 ESLint
        run: npm run lint

      - name: 🔎 Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: 🧪 Testes (Vitest)
        run: npm test

      - name: 🔨 Build estático (next build → out/)
        run: npm run build

      - name: 📑 Auditar artefatos do export
        id: audit
        run: |
          PAGE_COUNT=$(find ./out -name "*.html" | wc -l)
          PDF_COUNT=$(find ./out/certificates -name "*.pdf" 2>/dev/null | wc -l || echo "0")
          NOJEKYLL=$([ -f ./out/.nojekyll ] && echo "Sim" || echo "Não")
          echo "page_count=$PAGE_COUNT" >> "$GITHUB_OUTPUT"
          echo "pdf_count=$PDF_COUNT" >> "$GITHUB_OUTPUT"
          echo "nojekyll=$NOJEKYLL" >> "$GITHUB_OUTPUT"

      - name: 📊 Relatório
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          # 🧪 Relatório de Validação (CI)

          | Item | Status | Detalhe |
          | :--- | :--- | :--- |
          | 🎨 ESLint | 🟢 Aprovado | \`next lint\` |
          | 🔎 Typecheck | 🟢 Aprovado | \`tsc --noEmit\` |
          | 🧪 Testes | 🟢 Aprovado | Vitest + Testing Library |
          | 🔨 Build | 🟢 Aprovado | \`${{ steps.audit.outputs.page_count }}\` HTML em \`out/\` |
          | 📜 Certificados | 🟢 Aprovado | \`${{ steps.audit.outputs.pdf_count }}\` PDF(s) |
          | 🚫 \`.nojekyll\` | 🟢 Presente | ${{ steps.audit.outputs.nojekyll }} |

          Branch: \`${{ github.head_ref || github.ref_name }}\`
          EOF
