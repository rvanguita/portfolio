# Validação em Pull Requests para main: o build Astro é o gate (falha em link
# quebrado de conteúdo, erro de template ou de schema) + type-check.
name: 🧪 Validação do Portfólio (CI)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Nome mantido para casar com o status check exigido na proteção da branch main.
    name: 🔍 Lint, Types, Testes & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
