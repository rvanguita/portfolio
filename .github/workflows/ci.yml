# ==============================================================================
# GitHub Actions: Validação e Auditoria Contínua (CI)
# ==============================================================================
# Este fluxo executa a suíte de testes automatizados e valida a compilação do Jekyll
# antes de permitir a integração de qualquer Pull Request.
# ==============================================================================

name: 🧪 Validação & Testes do Portfólio (CI)

on:
  # Executa em Pull Requests direcionados à branch main
  pull_request:
    branches:
      - main

  # Permite execução manual a qualquer momento
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 🔍 Testes Automatizados & Compilação
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código do repositório (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python para Testes
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧪 Executar Suíte de Testes Automatizados
        run: |
          python3 scripts/test_site.py

      - name: ⚙️ Configurar ambiente Jekyll
        uses: actions/configure-pages@v5

      - name: 🔨 Compilar páginas com Jekyll (Dry Run)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: 📑 Auditar Estrutura e Links de PDFs
        id: audit
        run: |
          echo "::group::🔍 Auditoria de Artefatos Gerados"
          
          PAGE_COUNT=$(find ./_site -name "*.html" | wc -l)
          PDF_COUNT=$(find ./_site/certificates -name "*.pdf" 2>/dev/null | wc -l || echo "0")
          CSS_EXISTS=$([ -f "./_site/assets/css/custom.css" ] && echo "Sim" || echo "Não")
          IMG_COUNT=$(find ./_site/assets/img -type f 2>/dev/null | wc -l || echo "0")
          
          echo "Páginas HTML: $PAGE_COUNT"
          echo "Certificados PDF: $PDF_COUNT"
          echo "CSS Customizado: $CSS_EXISTS"
          echo "Imagens: $IMG_COUNT"
          
          echo "page_count=$PAGE_COUNT" >> "$GITHUB_OUTPUT"
          echo "pdf_count=$PDF_COUNT" >> "$GITHUB_OUTPUT"
          echo "css_exists=$CSS_EXISTS" >> "$GITHUB_OUTPUT"
          echo "img_count=$IMG_COUNT" >> "$GITHUB_OUTPUT"
          
          echo "::endgroup::"

      - name: 📊 Gerar Relatório de Auditoria (CI Report)
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # 🧪 Relatório de Auditoria e Testes Automatizados (CI)

          > [!NOTE]
          > **Todos os testes unitários de integridade e a compilação do Jekyll passaram com 100% de sucesso!**

          ---

          ### 📋 Checklist de Integridade do Portfólio

          | Item Auditado | Status | Detalhes |
          | :--- | :--- | :--- |
          | 🧪 **Suíte de Testes Python** | 🟢 **100% Aprovado** | \`scripts/test_site.py\` executado com sucesso |
          | 🔨 **Compilação Jekyll** | 🟢 **Aprovado** | Nenhuma falha de sintaxe Liquid/HTML |
          | 📄 **Páginas HTML** | 🟢 **Aprovado** | \`${{ steps.audit.outputs.page_count }}\` página(s) gerada(s) |
          | 📜 **Certificados PDF** | 🟢 **Aprovado** | \`${{ steps.audit.outputs.pdf_count }}\` arquivo(s) PDF verificados |
          | 🎨 **Folha de Estilos (CSS)** | 🟢 **Aprovado** | \`custom.css\` validado com cache-busting |
          | 🖼️ **Imagens & Ícones** | 🟢 **Aprovado** | \`${{ steps.audit.outputs.img_count }}\` imagens disponíveis |

          ---

          > [!TIP]
          > **Branch validada:** \`${{ github.head_ref || github.ref_name }}\`  
          > O site está seguro e aprovado para ser integrado na branch principal \`main\`.
          EOF
