# CI: lint + typecheck + testes + build estático em Pull Requests para main.
name: 🧪 Validação do Portfólio (CI)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 🔍 Lint, Types, Testes & Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🎨 ESLint
        run: npm run lint

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Testes (Vitest)
        run: npm test

      - name: 🔨 Build estático (next build → out/)
        run: npm run build
