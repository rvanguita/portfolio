# Semanalmente: relê os metadados dos repositórios públicos do usuário do perfil
# e abre um PR atualizando src/data/github-repos.json (no-op quando não há mudança).
name: 🔄 Sync GitHub repos

on:
  schedule:
    - cron: "17 6 * * 1" # segundas, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar snapshot
        run: node scripts/sync-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Abrir/atualizar PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-github
          base: main
          commit-message: "chore: sincroniza metadados dos repositórios do GitHub"
          title: "chore: sincroniza metadados dos repositórios do GitHub"
          labels: automated
          delete-branch: true
          body: |
            Atualização automática de `src/data/github-repos.json` a partir da API do GitHub.

            - `★`, linguagem e "atualizado há X" nos cards curados vêm daqui.
            - Repos públicos **sem** card curado aparecem na seção "Mais no GitHub".

            Para esconder um repo: topic `portfolio-hide` no GitHub.
            Para destacá-lo na seção automática: topic `portfolio-pin`.
