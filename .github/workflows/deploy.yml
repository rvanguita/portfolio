# Deploy: valida, compila (next build → out/) e publica no GitHub Pages a cada
# push em main. O job `deploy` depende do `build`, então lint/typecheck/testes
# ou build que falham bloqueiam a publicação.
name: 🚀 Deploy (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 📦 Testar & Compilar
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🎨 ESLint
        run: npm run lint

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Testes (Vitest)
        run: npm test

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 🔨 Build estático (next build → out/)
        run: npm run build

      - name: 📤 Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: 🌐 Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
