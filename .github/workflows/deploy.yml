# Publica os arquivos estáticos no GitHub Pages a cada push em main.
# Sem build: só copia os arquivos do site para _site/ e envia.
name: 🚀 Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 📁 Montar o site
        run: |
          mkdir _site
          cp -r index.html style.css icon.png .nojekyll projects certificates assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
