# Os links externos dos projetos quebram sem commit nenhum: basta renomear,
# arquivar ou tornar privado um repositório. Por isso a verificação é agendada e
# fica fora do CI de PR — mergear não deve depender da rede de terceiros.
name: 🔗 Links externos

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Conferir os links dos projetos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
      - run: node scripts/check_links.mjs
